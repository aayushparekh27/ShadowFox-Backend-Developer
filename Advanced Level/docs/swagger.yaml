openapi: 3.0.0
info:
  title: ClientPulse Enterprise Project & Deliverable Review API
  description: Advanced Level enterprise REST API for managing clients, projects, milestones, deliverable client reviews, automated invoicing, and compliance audit logs.
  version: 1.0.0
servers:
  - url: http://localhost:3003
    description: Local Development Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /health:
    get:
      summary: Health Check Endpoint
      responses:
        '200': { description: "API operational status" }
  /api/auth/register:
    post:
      summary: Register agency user, freelancer, or client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: "Alex Mercer" }
                email: { type: string, example: "alex@agency.com" }
                password: { type: string, example: "AdminPass123!" }
                role: { type: string, enum: [AGENCY_ADMIN, FREELANCER, CLIENT], example: "AGENCY_ADMIN" }
      responses:
        '201': { description: "User account created" }
  /api/auth/login:
    post:
      summary: Login user and retrieve Bearer JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: "admin@agency.com" }
                password: { type: string, example: "AdminPass123!" }
      responses:
        '200': { description: "Login successful with token" }
  /api/clients:
    post:
      summary: Agency Admin create client profile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName, contactName, contactEmail]
              properties:
                companyName: { type: string, example: "Stark Industries" }
                contactName: { type: string, example: "Pepper Potts" }
                contactEmail: { type: string, example: "pepper@stark.com" }
                industry: { type: string, example: "ENERGY" }
      responses:
        '201': { description: "Client created" }
  /api/projects:
    post:
      summary: Create project linked to client
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, title, totalBudget]
              properties:
                clientId: { type: integer, example: 1 }
                title: { type: string, example: "Arc Reactor Web Portal" }
                description: { type: string, example: "Enterprise telemetry dashboard." }
                totalBudget: { type: number, example: 75000 }
      responses:
        '201': { description: "Project created" }
  /api/deliverables/{id}/review:
    post:
      summary: Client or Admin review submitted deliverable
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REVISION_REQUESTED], example: "APPROVED" }
                feedbackNotes: { type: string, example: "Looks great! Approved for payment." }
      responses:
        '200': { description: "Review decision logged & invoice auto-generated if approved" }
  /api/audit-logs:
    get:
      summary: Agency Admin retrieve compliance audit logs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: "Audit trail logs" }
